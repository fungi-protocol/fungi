[package]
name = "fungi-e2ee"
description = "Messages encrypted with a key both parties already have"
version.workspace = true
edition.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = [
  "alloc",
  "getrandom",
] }
thiserror = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
