[package]
name = "fungi-bip77-directory"
description = "BIP77 directory backend for Fungi linked mailboxes"
version.workspace = true
edition.workspace = true

[dependencies]
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
bhttp = "0.6.1"
fungi-mailbox = { path = "../mailbox" }
ohttp = { package = "bitcoin-ohttp", version = "0.6.0", default-features = false, features = [
  "client",
  "rust-hpke",
] }
rand = "0.8"
thiserror = "2"
url = "2"

[dev-dependencies]
ohttp = { package = "bitcoin-ohttp", version = "0.6.0", features = ["server"] }
tokio = { version = "1", features = [
  "macros",
  "rt",
  "sync",
  "test-util",
  "time",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
