[package]
name = "fungi-transport-testkit"
description = "In-memory transport and reusable conformance checks for Fungi"
version.workspace = true
edition.workspace = true

[dependencies]
fungi-transport = { path = "../transport" }
futures-util = { version = "0.3", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[[example]]
name = "offline-peers"
test = true
