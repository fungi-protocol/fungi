[package]
name = "fungi-transport-tor-socks"
description = "Message channels through an external tor daemon"
version.workspace = true
edition.workspace = true

[dependencies]
fungi-transport = { path = "../transport" }
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }
tor-hscrypto = { version = "0.47", default-features = false }

[dev-dependencies]
data-encoding = "2"
proptest = "=1.11.0"
safelog = "0.10"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
