[package]
name = "fungi-mailbox"
description = "Encrypted simplex linked mailboxes for shared-secret peers"
version.workspace = true
edition.workspace = true

[dependencies]
hkdf = "0.12"
hpke = { package = "bitcoin-hpke", version = "0.13.0" }
rand = "0.8"
secp256k1 = "0.29"
sha2 = { version = "0.10", default-features = false }
thiserror = "2"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = [
  "macros",
  "rt",
  "sync",
  "test-util",
  "time",
] }
